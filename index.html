    let state = { doneIds: [], custom: {}, meta: {}, deletedIds: [], editedTexts: {}, order: {} };
    let activeTab = 'resumen';
    let lastMovedId = null; // Para controlar la tarea resaltada

    const BADGE_COLORS = {
      'Urgente': 'bg-rose-100 text-rose-800 border-rose-200',
      'Gestión': 'bg-blue-100 text-blue-800 border-blue-200',
      'Proveedores': 'bg-amber-100 text-amber-800 border-amber-200',
      'Diseño': 'bg-purple-100 text-purple-800 border-purple-200',
      'Audiovisual': 'bg-emerald-100 text-emerald-800 border-emerald-200'
    };

    function init() {
      const params = new URLSearchParams(window.location.search);
      const shared = params.get('s');
      if (shared) {
        try {
          const decoded = JSON.parse(decodeURIComponent(atob(shared)));
          if (decoded && Array.isArray(decoded.doneIds)) {
            state = decoded;
            if (!state.deletedIds) state.deletedIds = [];
            if (!state.editedTexts) state.editedTexts = {};
            if (!state.order) state.order = {};
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            document.getElementById('sync-banner').classList.remove('hidden');
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {}
      } else {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { 
            state = JSON.parse(saved); 
            if (!state.deletedIds) state.deletedIds = [];
            if (!state.editedTexts) state.editedTexts = {};
            if (!state.order) state.order = {};
          } catch (e) {}
        }
      }
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function getEventTasks(ev) {
      const extras = (state.custom && state.custom[ev.id]) ? state.custom[ev.id] : [];
      const combined = [...ev.tasks, ...extras];
      
      let tasks = combined
        .filter(t => !state.deletedIds.includes(t.id))
        .map(t => {
          const customText = state.editedTexts[t.id];
          return customText !== undefined ? { ...t, t: customText } : t;
        });

      if (state.order && state.order[ev.id]) {
        const orderIds = state.order[ev.id];
        tasks.sort((a, b) => {
          let idxA = orderIds.indexOf(a.id);
          let idxB = orderIds.indexOf(b.id);
          if (idxA === -1) idxA = 999;
          if (idxB === -1) idxB = 999;
          return idxA - idxB;
        });
      }

      return tasks;
    }

    function moveTask(eventId, taskId, direction) {
      const ev = BASE_EVENTS.find(e => e.id === eventId);
      let tasks = getEventTasks(ev);
      let ids = tasks.map(t => t.id);

      const index = ids.indexOf(taskId);
      if (index === -1) return;

      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= ids.length) return;

      const temp = ids[index];
      ids[index] = ids[targetIndex];
      ids[targetIndex] = temp;

      state.order[eventId] = ids;
      lastMovedId = taskId; // Marcar esta tarea como la movida
      save();

      // Quitar el resaltado a los 2 segundos
      setTimeout(() => {
        if (lastMovedId === taskId) {
          lastMovedId = null;
          render();
        }
      }, 2000);
    }

    function getEventMeta(ev) {
      const m = (state.meta && state.meta[ev.id]) ? state.meta[ev.id] : {};
      return {
        date: m.date || ev.date,
        time: m.time || ev.time,
        place: m.place || ev.place
      };
    }

    function toggleTask(taskId) {
      const idx = state.doneIds.indexOf(taskId);
      if (idx > -1) state.doneIds.splice(idx, 1);
      else state.doneIds.push(taskId);
      save();
    }

    function deleteTask(taskId) {
      if (!confirm('¿Estás seguro de que quieres eliminar esta tarea de la agenda?')) return;
      if (!state.deletedIds.includes(taskId)) {
        state.deletedIds.push(taskId);
      }
      save();
    }

    function updateTaskText(taskId, newText) {
      const val = newText.trim();
      if (!val) return;
      state.editedTexts[taskId] = val;
      save();
    }

    function updateMeta(eventId, field, val) {
      if (!state.meta[eventId]) state.meta[eventId] = {};
      state.meta[eventId][field] = val;
      save();
    }

    function addCustomTask(eventId) {
      const tInput = document.getElementById('new-t');
      const wInput = document.getElementById('new-w');
      const cInput = document.getElementById('new-c');
      const text = tInput.value.trim();
      if (!text) return;

      if (!state.custom[eventId]) state.custom[eventId] = [];
      const newId = 'x_' + Date.now().toString(36);
      state.custom[eventId].push({
        id: newId,
        c: cInput.value,
        w: wInput.value.trim() || 'Equipo',
        t: text
      });

      if (!state.order[eventId]) {
        const ev = BASE_EVENTS.find(e => e.id === eventId);
        state.order[eventId] = getEventTasks(ev).map(t => t.id);
      }
      state.order[eventId].push(newId);

      tInput.value = '';
      wInput.value = '';
      save();
    }

    function setTab(id) {
      activeTab = id;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      let total = 0;
      let done = 0;
      BASE_EVENTS.forEach(ev => {
        const tasks = getEventTasks(ev);
        total += tasks.length;
        tasks.forEach(t => { if (state.doneIds.includes(t.id)) done++; });
      });
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('global-pct').textContent = `${pct}% (${done}/${total})`;
      document.getElementById('global-bar').style.width = `${pct}%`;

      const tabsBar = document.getElementById('tabs-bar');
      let tabsHtml = `
        <button onclick="setTab('resumen')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 ${
          activeTab === 'resumen' ? 'bg-white text-slate-950 shadow' : 'bg-slate-800 text-slate-300'
        }">
          <span>📅 Listado General</span>
        </button>
      `;

      BASE_EVENTS.forEach(ev => {
        const tasks = getEventTasks(ev);
        const evDone = tasks.filter(t => state.doneIds.includes(t.id)).length;
        const isCurrent = ev.id === activeTab;
        const allDone = tasks.length > 0 && evDone === tasks.length;

        tabsHtml += `
          <button onclick="setTab('${ev.id}')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 ${
            isCurrent ? 'bg-white text-slate-950 shadow' : 'bg-slate-800 text-slate-300'
          }">
            <span>${ev.tab}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full ${
              allDone ? 'bg-emerald-500 text-slate-950 font-bold' : isCurrent ? 'bg-slate-200 text-slate-800' : 'bg-slate-700 text-slate-300'
            }">${evDone}/${tasks.length}</span>
          </button>
        `;
      });
      tabsBar.innerHTML = tabsHtml;

      const mainView = document.getElementById('main-view');

      if (activeTab === 'resumen') {
        let html = `
          <div class="space-y-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Resumen Ejecutivo</span>
              <h2 class="text-base font-bold text-slate-900 mt-1">Cronograma de Eventos 2026</h2>
              <p class="text-xs text-slate-500 mt-0.5">Toca cualquier evento para ordenar prioridades, editar, marcar o eliminar tareas.</p>
            </div>
        `;

        BASE_EVENTS.forEach(ev => {
          const tasks = getEventTasks(ev);
          const evDone = tasks.filter(t => state.doneIds.includes(t.id)).length;
          const evPct = tasks.length ? Math.round((evDone / tasks.length) * 100) : 0;
          const meta = getEventMeta(ev);

          html += `
            <div onclick="setTab('${ev.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 active:bg-slate-50 cursor-pointer transition">
              <div class="flex items-start justify-between gap-2 mb-2">
                <div>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${ev.status}</span>
                  <h3 class="text-sm font-bold text-slate-900 mt-1">${ev.title}</h3>
                </div>
                <span class="text-xs font-bold px-2 py-1 rounded-lg bg-slate-100 text-slate-700 shrink-0">
                  ${evPct}%
                </span>
              </div>
              <div class="text-xs text-slate-600 space-y-1 mt-2 border-t border-slate-100 pt-2">
                <div>📅 <b>Fecha:</b> ${meta.date}</div>
                <div>⏰ <b>Hora:</b> ${meta.time}</div>
                <div>📍 <b>Lugar:</b> ${meta.place}</div>
              </div>
              <div class="mt-3 flex items-center justify-between text-xs text-emerald-600 font-semibold">
                <span>Ver checklist y pendientes (${evDone}/${tasks.length})</span>
                <span>→</span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        mainView.innerHTML = html;

      } else {
        const ev = BASE_EVENTS.find(e => e.id === activeTab);
        const tasks = getEventTasks(ev);
        const evDone = tasks.filter(t => state.doneIds.includes(t.id)).length;
        const evPct = tasks.length ? Math.round((evDone / tasks.length) * 100) : 0;
        const meta = getEventMeta(ev);

        mainView.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200">
              <div class="flex items-start justify-between gap-2 mb-3">
                <div>
                  <button onclick="setTab('resumen')" class="text-xs font-semibold text-blue-600 mb-1 inline-block">← Volver al Listado General</button>
                  <h2 class="text-base font-bold text-slate-900 leading-snug">${ev.title}</h2>
                </div>
                <span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200">
                  ${evPct}%
                </span>
              </div>

              <div class="space-y-1.5 text-xs">
                <div class="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
                  <span class="text-slate-400 font-semibold w-14 shrink-0">📅 Fecha:</span>
                  <input type="text" value="${meta.date}" onchange="updateMeta('${ev.id}', 'date', this.value)"
                    class="w-full font-semibold text-slate-800 bg-transparent focus:outline-none focus:bg-yellow-50 rounded" />
                </div>
                <div class="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
                  <span class="text-slate-400 font-semibold w-14 shrink-0">⏰ Hora:</span>
                  <input type="text" value="${meta.time}" onchange="updateMeta('${ev.id}', 'time', this.value)"
                    class="w-full font-semibold text-slate-800 bg-transparent focus:outline-none focus:bg-yellow-50 rounded" />
                </div>
                <div class="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
                  <span class="text-slate-400 font-semibold w-14 shrink-0">📍 Lugar:</span>
                  <input type="text" value="${meta.place}" onchange="updateMeta('${ev.id}', 'place', this.value)"
                    class="w-full font-semibold text-slate-800 bg-transparent focus:outline-none focus:bg-yellow-50 rounded" />
                </div>
              </div>
            </div>

            <!-- Indicador para ordenar -->
            <div class="bg-amber-50 border-b border-amber-100 px-4 py-2 text-[11px] text-amber-800 flex items-center justify-between">
              <span>↕️ Usa las flechas <b>▲ ▼</b> para ordenar las prioridades de las tareas.</span>
            </div>

            <div class="divide-y divide-slate-100">
              ${
                tasks.map((t, idx) => {
                  const isDone = state.doneIds.includes(t.id);
                  const badge = BADGE_COLORS[t.c] || 'bg-slate-100 text-slate-700';
                  const isHighlighted = (t.id === lastMovedId);
                  const rowClass = isHighlighted ? 'highlight-move' : (isDone ? 'bg-slate-50/60' : '');

                  return `
                    <div class="p-3.5 flex items-start justify-between gap-2 transition ${rowClass}">
                      <!-- Botones para reordenar -->
                      <div class="flex flex-col gap-0.5 pt-1 shrink-0">
                        <button onclick="moveTask('${ev.id}', '${t.id}', -1)" title="Subir prioridad" ${idx === 0 ? 'disabled class="opacity-20 cursor-default"' : 'class="text-slate-400 hover:text-slate-700 font-bold text-xs p-0.5"'}">▲</button>
                        <button onclick="moveTask('${ev.id}', '${t.id}', 1)" title="Bajar prioridad" ${idx === tasks.length - 1 ? 'disabled class="opacity-20 cursor-default"' : 'class="text-slate-400 hover:text-slate-700 font-bold text-xs p-0.5"'}">▼</button>
                      </div>

                      <div class="mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 cursor-pointer transition ${
                        isDone ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                      }" onclick="toggleTask('${t.id}')">
                        ${isDone ? '✓' : ''}
                      </div>

                      <div class="flex-1 min-w-0">
                        <textarea rows="2" onchange="updateTaskText('${t.id}', this.value)"
                          class="w-full text-sm bg-transparent border border-transparent hover:border-slate-200 focus:border-slate-400 focus:bg-white rounded p-1 -m-1 resize-none focus:outline-none leading-snug ${isDone ? 'task-done' : 'text-slate-800 font-medium'}">${t.t}</textarea>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1">
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${badge}">${t.c}</span>
                          <span class="text-[11px] text-slate-500 font-medium">👤 ${t.w}</span>
                        </div>
                      </div>

                      <button onclick="deleteTask('${t.id}')" title="Eliminar tarea" class="text-slate-300 hover:text-rose-600 p-1 text-sm shrink-0 transition">
                        ✕
                      </button>
                    </div>
                  `;
                }).join('')
              }
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-2">
              <div class="text-[11px] font-bold uppercase text-slate-400">Agregar tarea a este evento</div>
              <div class="flex gap-2">
                <select id="new-c" class="text-xs bg-white border border-slate-200 rounded-lg px-2 py-2 flex-1">
                  <option value="Gestión">📋 Gestión</option>
                  <option value="Proveedores">🤝 Proveedores</option>
                  <option value="Diseño">🎨 Diseño</option>
                  <option value="Audiovisual">🎥 Audiovisual</option>
                  <option value="Urgente">🔥 Urgente</option>
                </select>
                <input id="new-w" type="text" placeholder="Resp. (ej. Noe, Rubén)" class="text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-2 flex-1" />
              </div>
              <div class="flex gap-2">
                <input id="new-t" type="text" placeholder="Escribir pendiente..." class="text-xs bg-white border border-slate-200 rounded-lg px-3 py-2.5 flex-1" />
                <button onclick="addCustomTask('${ev.id}')" class="bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shrink-0">
                  + Sumar
                </button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function shareWhatsApp() {
      const encoded = btoa(encodeURIComponent(JSON.stringify(state)));
      const isWeb = window.location.protocol.startsWith('http');
      let msg = `*Actualización Agenda Remeros + Pigmento*\n`;
      
      if (isWeb) {
        const shareUrl = `${window.location.origin}${window.location.pathname}?s=${encoded}`;
        msg += `👉 *Toca este link para ver el tablero actualizado en tu celular:*\n${shareUrl}`;
      } else {
        msg += buildTextSummary();
      }

      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function buildTextSummary() {
      let lines = ['📊 *ESTADO DE EVENTOS — REMEROS + PIGMENTO*\n'];
      BASE_EVENTS.forEach(ev => {
        const tasks = getEventTasks(ev);
        const done = tasks.filter(t => state.doneIds.includes(t.id)).length;
        const pending = tasks.filter(t => !state.doneIds.includes(t.id));
        lines.push(`*${ev.tab}* (${done}/${tasks.length} listas)`);
        pending.slice(0, 3).forEach(p => {
          lines.push(`  ▫️ ${p.t} _(${p.w})_`);
        });
        if (pending.length > 3) lines.push(`  _...y ${pending.length - 3} pendientes más_`);
        lines.push('');
      });
      return lines.join('\n');
    }

    function copyResumen() {
      const text = buildTextSummary();
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = '✅ Resumen copiado para WhatsApp';
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2500);
      });
    }

    function resetBoard() {
      if (!confirm('¿Reiniciar marcas, orden, tareas editadas y eliminadas?')) return;
      state = { doneIds: [], custom: {}, meta: {}, deletedIds: [], editedTexts: {}, order: {} };
      save();
    }

    init();
  </script>
</body>
</html>
